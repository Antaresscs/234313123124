<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARehab</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#EDF5F6;--card:#ffffff;--line:#d6e4e6;--txt:#123238;--mut:#6b8489;--acc:#14B3AD;--hot:#ff6b4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:12px 14px 24px}
.screen{display:none}.screen.on{display:block}
.stage{position:relative;margin:0 auto;width:100%;max-width:330px}
.stage img{width:100%;display:block}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.z{fill:var(--hot);fill-opacity:0;cursor:pointer;transition:.15s}
.z:hover{fill-opacity:.25}.z.sel{fill-opacity:.6;filter:url(#glow)}
.side{display:flex;justify-content:center;gap:8px;margin:4px 0 10px}
.seg{display:flex;background:#dbe9eb;border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;color:var(--mut);cursor:pointer;font-size:13px}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 3px #0001}
.brand{text-align:center;font-weight:800;font-size:20px;color:var(--acc);letter-spacing:.5px;margin:4px 0 2px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mut);letter-spacing:0}
.hint{text-align:center;color:var(--mut);margin:10px 0;min-height:22px}
.picked{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;align-items:center;gap:10px;margin:8px 0}
.picked.on{display:flex}.picked div{flex:1;font-size:14px}.picked b{display:block;font-size:12px;color:var(--mut);font-weight:500}
.btn{background:var(--acc);color:#fff;border:0;border-radius:22px;padding:11px 16px;font-weight:700;cursor:pointer}
.sep{color:var(--mut);font-size:13px;font-weight:600;margin:16px 2px 8px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:0;box-shadow:0 2px 8px #0b3a3f14;border-radius:18px;padding:12px;cursor:pointer;font-weight:600;font-size:14px}
.card i{font-style:normal;font-size:20px;display:block;margin-bottom:6px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:6px 12px;cursor:pointer}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:11px 14px;color:var(--txt);font-size:14px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:8px;background:var(--card);border-radius:14px;box-shadow:0 1px 4px #0b3a3f10;cursor:pointer}
.num{min-width:42px;height:34px;background:#d9f3f1;color:var(--acc);border-radius:17px;display:grid;place-items:center;font-weight:700}
.ex{background:var(--card);border:0;box-shadow:0 2px 8px #0b3a3f14;border-radius:14px;padding:14px;margin-bottom:10px}
.ex .d{display:flex;gap:20px;margin:8px 0;color:var(--acc);font-weight:700;font-size:18px}
.ex .d small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.thumb{width:56px;height:44px;border-radius:10px;object-fit:cover;background:#dbe9eb;flex:none}
.ex img{width:100%;border-radius:10px;margin:8px 0;background:#eef5f6}
.stg{font-weight:700;color:var(--acc);margin:18px 2px 8px}
.lock{background:#fff7e8;border-radius:14px;padding:12px;color:#8a6420;font-size:14px;margin-bottom:10px}
.info{background:#e4f6f4;border-radius:14px;padding:12px;margin-bottom:10px;font-size:14px;white-space:pre-line}
.muted{color:var(--mut);font-size:13px}
.demo{font-size:11px;color:#ffb44d;text-align:center;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">

  <!-- Экран 1: фигура -->
  <section id="s-body" class="screen on">
    <div class="brand">STARehab<small>Где беспокоит? Можно выбрать несколько областей</small></div>
    <div class="side">
      <div class="seg" id="segSide"><button class="on" onclick="setSide('front')">Спереди</button><button onclick="setSide('back')">Сзади</button></div>
      <div class="seg" id="segSex"><button class="on" onclick="setSex('f')">Ж</button><button onclick="setSex('m')">М</button></div>
    </div>
    <div class="stage">
      <img id="fig" src="f_front.jpg" alt="Фигура человека">
      <svg id="zones" viewBox="0 0 1024 1536"><defs><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter></defs></svg>
    </div>
    <div class="hint" id="hint"></div>
    <div class="picked" id="picked"><div><b>Выбрано: <a href="#" onclick="clearSel();return false" style="color:var(--acc)">сбросить</a></b><span id="pname"></span></div><button class="btn" onclick="showList()">Показать упражнения</button></div>
    <div class="sep">Ещё</div>
    <div class="cards">
      <div class="card" onclick="askCode()"><i>#</i>Найти по номеру</div>
      <div class="card" onclick="tgSay('💬 Вопрос')"><i>💬</i>Спросить специалиста</div>
      <div class="card" onclick="tgSay('ИИ-помощник')"><i>🤖</i>ИИ-помощник</div>
      <div class="card" onclick="tgSay('▶️ Моя тренировка')"><i>▶️</i>Мои программы</div>
    </div>
  </section>

  <!-- Экран 2: список -->
  <section id="s-list" class="screen">
    <div class="top"><button class="back" onclick="go('s-body')">←</button><b id="ltitle">Программы</b></div>
    <input id="q" placeholder="Поиск по номеру или названию" oninput="renderList()">
    <div id="list"></div>
  </section>

  <!-- Экран 3: программа -->
  <section id="s-prog" class="screen">
    <div class="top"><button class="back" onclick="go('s-list')">←</button><b id="ptitle"></b></div>
    <div class="muted" id="pmeta"></div><br>
    <div id="exs"></div>
  </section>
</div>

<script>
// ===== Настройка =====
const API_URL = 'https://antaress2.app.n8n.cloud/webhook/starehab-app'; // сценарий n8n «STARehab — приложение (данные)»
const BOT_URL = '';            // ссылка на бот пациентов, например https://t.me/имя_бота
const CACHE_MIN = 30;          // сколько минут помнить программы на телефоне (экономит запуски n8n)

// Зоны: [название, x, y, rx, ry, парная?] в координатах картинки 1024×1536.
// Парная зона автоматически зеркалится на вторую сторону. Крупные — первыми (лежат снизу).
const Z = {
 front:[
  ['Грудная клетка',512,385,105,70],['Область молочной железы',445,395,42,35,1],
  ['Эпигастральная область',512,480,70,30],['Боковая область живота',432,535,30,50,1],['Пупочная область',512,540,55,28],
  ['Надлобковая область',512,612,58,22],['Паховая область',445,655,38,22,1],['Малый таз / промежность',512,715,30,38],
  ['Тазобедренный сустав',385,670,32,42,1],['Передняя область бедра',440,840,55,100,1],
  ['Голова',512,135,60,90],['Шейный отдел',512,245,38,28],['Надплечье / ключица',440,290,55,20,1],
  ['Плечевой сустав',368,322,40,42,1],['Плечо',335,425,30,62,1],['Локтевой сустав',300,525,32,32,1],
  ['Предплечье',278,610,26,52,1],['Лучезапястный сустав',258,693,28,20,1],['Кисть',232,775,40,55,1],
  ['Коленный сустав',425,1000,45,45,1],['Голень',413,1150,36,95,1],['Голеностопный сустав',405,1310,32,24,1],['Стопа',398,1375,40,30,1]],
 back:[
  ['Затылок',512,130,60,80],['Шейный отдел',512,250,40,32],['Надплечье (трапеция)',440,288,55,22,1],
  ['Лопатка',435,385,48,60,1],['Грудной отдел позвоночника',512,410,28,105],['Поясничный отдел',512,560,70,42],
  ['Крестец / копчик',512,640,38,30],['Ягодичная область',448,705,55,55,1],
  ['Плечевой сустав',360,322,40,42,1],['Плечо',330,425,30,62,1],['Локтевой сустав',300,525,32,32,1],
  ['Предплечье',278,610,26,52,1],['Кисть',232,775,40,55,1],
  ['Задняя поверхность бедра',440,870,55,100,1],['Подколенная область',425,1010,40,35,1],
  ['Икроножная мышца',415,1150,40,95,1],['Пятка / ахиллово сухожилие',405,1340,32,40,1]]
};
// Демо-программы — только если API_URL пустой.
const DEMO = [{id:'1',name:'Демо: плечо',body:['Плечевой сустав'],img:'',stages:[{order:2,name:'Этап 1',locked:false,count:1,
  ex:[{name:'Маятниковые движения',dosage:'10 повторений, 2 подхода',description:'Наклонитесь вперёд, рука свободно свисает.',img:''}]}]}];
const tg = window.Telegram && Telegram.WebApp; if(tg){tg.ready();tg.expand();}
let sex='f', side='front', picked=new Set(), data=API_URL?[]:DEMO, cur=null, loaded=!API_URL;

function draw(){
  document.getElementById('fig').src = `${sex}_${side}.jpg`;
  const svg=document.getElementById('zones'); svg.querySelectorAll('ellipse').forEach(c=>c.remove());
  Z[side].forEach(([n,x,y,rx,ry,pair])=>{ (pair?[x,1024-x]:[x]).forEach(cx=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    c.setAttribute('cx',cx);c.setAttribute('cy',y);c.setAttribute('rx',rx);c.setAttribute('ry',ry);
    c.setAttribute('class','z'+(picked.has(n)?' sel':''));
    c.onclick=()=>{picked.has(n)?picked.delete(n):picked.add(n);draw();upd();
      tg&&tg.HapticFeedback&&tg.HapticFeedback.selectionChanged();};
    svg.appendChild(c);});
  });
}
function upd(){const on=picked.size>0;document.getElementById('picked').classList.toggle('on',on);
  document.getElementById('pname').textContent=[...picked].join(', ');}
function clearSel(){picked.clear();draw();upd()}
function mark(id,i){document.querySelectorAll('#'+id+' button').forEach((b,j)=>b.classList.toggle('on',j===i))}
function setSide(s){side=s;mark('segSide',s==='front'?0:1);draw()}
function setSex(s){sex=s;mark('segSex',s==='f'?0:1);draw()}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}

async function load(){ if(!API_URL) return;
  try{ const c=JSON.parse(localStorage.getItem('progs')||'null');
       if(c && Date.now()-c.t < CACHE_MIN*60000){ data=c.p; loaded=true; return; } }catch(e){}
  try{ const r=await fetch(API_URL); const j=await r.json(); data=j.programs||[]; loaded=true;
       try{localStorage.setItem('progs',JSON.stringify({t:Date.now(),p:data}))}catch(e){}
  }catch(e){ loaded='err'; }
  if(document.getElementById('s-list').classList.contains('on')) renderList();
}
const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showList(){document.getElementById('ltitle').textContent=picked.size===1?[...picked][0]:'Выбрано областей: '+picked.size;document.getElementById('q').value='';renderList();go('s-list')}
function renderList(){
  const L=document.getElementById('list');
  if(loaded===false){L.innerHTML='<p class="muted">Загружаю программы…</p>';return}
  if(loaded==='err'){L.innerHTML='<p class="muted">Не удалось загрузить программы. Проверьте интернет и попробуйте ещё раз.</p>';return}
  const q=document.getElementById('q').value.trim().toLowerCase();
  const items=data.filter(p=> q ? (String(p.id).toLowerCase()===q || p.name.toLowerCase().includes(q)) : (!picked.size || p.body.some(b=>picked.has(b))));
  L.innerHTML = items.length ? items.map(p=>
    `<div class="row" onclick="openProg('${esc(p.id)}')"><div class="num">${esc(p.id)}</div>${p.img?`<img class="thumb" loading="lazy" src="${esc(p.img)}">`:''}<div>${esc(p.name)}</div></div>`).join('')
    : '<p class="muted">Для этой области программ пока нет. Попробуйте поиск или спросите специалиста.</p>';
}
function dose(d){const r=(d.match(/(\d+)\s*повтор/)||[])[1], s=(d.match(/(\d+)\s*подход/)||[])[1];
  if(r||s) return `<div class="d">${r?`<div><small>Повторения</small>${r}</div>`:''}${s?`<div><small>Подходы</small>${s}</div>`:''}</div>`;
  return d?`<div class="d"><div><small>Дозировка</small>${esc(d)}</div></div>`:'';}
function openProg(id){cur=data.find(p=>String(p.id)===String(id)); if(!cur) return;
  document.getElementById('ptitle').textContent=cur.name;
  const total=cur.stages.reduce((a,s)=>a+(s.count||0),0);
  document.getElementById('pmeta').textContent=`Программа №${cur.id} · этапов: ${cur.stages.length} · упражнений: ${total}`;
  let n=0;
  document.getElementById('exs').innerHTML=cur.stages.map(st=>{
    let h=`<div class="stg">${esc(st.name||('Этап '+st.order))}</div>`;
    if(st.locked) return h+`<div class="lock">🔒 Этот этап открывается по коду от специалиста.<br>Введите код в боте: «🔑 Ввести код».</div>`;
    return h+st.ex.map(e=> e.info
      ? `<div class="info"><b>${esc(e.name)}</b>${e.description?'\n'+esc(e.description):''}</div>`
      : `<div class="ex"><b>${++n}. ${esc(e.name)}</b>${e.img?`<img loading="lazy" src="${esc(e.img)}">`:''}${dose(e.dosage||'')}<div class="muted">${esc(e.description)}</div></div>`).join('');
  }).join('');
  go('s-prog');
}
function askCode(){go('s-list');document.getElementById('ltitle').textContent='Поиск по номеру';picked.clear();upd();draw();document.getElementById('q').focus();renderList()}
function tgSay(t){
  if(BOT_URL && tg && tg.openTelegramLink){ tg.openTelegramLink(BOT_URL); tg.close(); return; }
  if(tg && tg.close){ tg.close(); return; }
  document.getElementById('hint').textContent='«'+t+'» — откройте в чате бота';
}
draw(); load();
</script>
</body>
</html>
